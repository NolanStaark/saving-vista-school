name: Update Meeting Schedule

on:
  schedule:
    # Once a day at 13:00 UTC (~6-7am Mountain time). Vista's calendar
    # changes occasionally, not constantly, so daily is plenty.
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 icalendar recurring-ical-events

      - name: Pull Vista's meeting schedule
        run: python scripts/update_meetings.py

      - name: Commit changes if the schedule moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/data/meetings.json; then
            echo "No changes to the meeting schedule."
          else
            git add assets/data/meetings.json
            git commit -m "Update meeting schedule from Vista's calendar"
            git push
          fi
