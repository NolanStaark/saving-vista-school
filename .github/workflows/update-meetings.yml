name: Update Meeting Schedule

on:
  schedule:
    # Once a day at 13:00 UTC (~6-7am Mountain time). Vista's calendar
    # changes occasionally, not constantly, so daily is plenty.
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 icalendar recurring-ical-events

      - name: Pull Vista's meeting schedule
        id: pull
        run: python scripts/update_meetings.py

      # The file is rewritten every run because it carries a "last checked"
      # timestamp the page displays, so the commit message is what makes the
      # history readable: it says outright whether the schedule actually moved
      # or whether this was just the daily check finding nothing new.
      - name: Commit changes if the schedule moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/data/meetings.json; then
            echo "Nothing to commit."
          else
            if [ "${{ steps.pull.outputs.schedule_changed }}" = "true" ]; then
              MSG="Update meeting schedule from Vista's calendar"
            else
              MSG="Meeting schedule checked -- no change"
            fi
            git add assets/data/meetings.json
            git commit -m "$MSG"
            git push
          fi
